<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
.burger { display: none; }
.menu { display: flex; gap: 15px; list-style: none; padding: 0; }
@media (max-width: 600px) {
.burger { display: block; }
.menu { display: block; max-height: 0; overflow: hidden; transition: max-height 0.4s; }
.menu.open { max-height: 150px; }
}
</style>
</head>
<body>
<button class="burger" onclick="document.getElementById('menu').classList.toggle('open')">☰ Меню</button>
<ul class="menu" id="menu">
<li><a href="#f">Початок тесту</a></li>
<li><a href="#q5">Списки</a></li>
<li><a href="#q7">Текстове поле</a></li>
<li><a href="#res">Результат</a></li>
</ul>

<h2>Тест</h2>
<form id="f">
<p><b>1. Скільки буде 2 + 3?</b><br>
<label><input type="radio" name="q1" value="1"> 5</label>
<label><input type="radio" name="q1" value="0"> 4</label>
<label><input type="radio" name="q1" value="0"> 6</label>
<label><input type="radio" name="q1" value="0"> 3</label></p>

<p><b>2. Скільки буде 10 - 4?</b><br>
<label><input type="radio" name="q2" value="1"> 6</label>
<label><input type="radio" name="q2" value="0"> 5</label>
<label><input type="radio" name="q2" value="0"> 7</label>
<label><input type="radio" name="q2" value="0"> 8</label></p>

<p><b>3. Числа менші за 5:</b><br>
<label><input type="checkbox" name="q3" value="1"> 2</label>
<label><input type="checkbox" name="q3" value="1"> 3</label>
<label><input type="checkbox" name="q3" value="-1"> 7</label>
<label><input type="checkbox" name="q3" value="-1"> 9</label></p>

<p><b>4. Парні числа:</b><br>
<label><input type="checkbox" name="q4" value="1"> 2</label>
<label><input type="checkbox" name="q4" value="1"> 4</label>
<label><input type="checkbox" name="q4" value="1"> 6</label>
<label><input type="checkbox" name="q4" value="-1"> 5</label></p>

<p><b>5. Скільки буде 5 + 5?</b><br>
<select id="q5">
<option value="0">-- Оберіть --</option>
<option value="0">9</option>
<option value="1">10</option>
<option value="0">11</option>
<option value="0">12</option>
</select></p>

<p><b>6. Круглі числа:</b><br>
<select id="q6" multiple size="4">
<option value="1">10</option>
<option value="1">20</option>
<option value="-1">3</option>
<option value="-1">7</option>
</select></p>

<p><b>7. Напишіть слово «п'ять»:</b><br>
<input type="text" id="q7"></p>

<button type="button" onclick="check()">Завершити тестування</button>
</form>
<div id="res"></div>

<script>
function check() {
let qs = ["2 + 3", "10 - 4", "Менші за 5", "Парні числа", "5 + 5", "Круглі числа", "Слово «п'ять»"];
let sum = 0, html = "<br><table border='1'><tr><th>Запитання</th><th>Відповідь</th><th>Бал</th></tr>";

for (let n = 1; n <= 4; n++) {
let els = document.getElementsByName("q" + n), a = [], b = 0;
for (let el of els) if (el.checked) { a.push(el.parentElement.textContent.trim()); b += +el.value; }
if (b < 0) b = 0; sum += b;
html += `<tr><td>${n}. ${qs[n-1]}</td><td>${a.join(", ") || "Не обрано"}</td><td>${b}</td></tr>`;
}

let s5 = document.getElementById("q5"), b5 = +s5.value; sum += b5;
html += `<tr><td>5. ${qs[4]}</td><td>${s5.options[s5.selectedIndex].text}</td><td>${b5}</td></tr>`;

let s6 = document.getElementById("q6"), a6 = [], b6 = 0;
for (let opt of s6.options) if (opt.selected) { a6.push(opt.text); b6 += +opt.value; }
if (b6 < 0) b6 = 0; sum += b6;
html += `<tr><td>6. ${qs[5]}</td><td>${a6.join(", ") || "Не обрано"}</td><td>${b6}</td></tr>`;

let t7 = document.getElementById("q7").value.trim().toLowerCase();
let b7 = (t7 == "п'ять" || t7 == "пять") ? 1 : 0; sum += b7;
html += `<tr><td>7. ${qs[6]}</td><td>${t7 || "Не введено"}</td><td>${b7}</td></tr></table><p>Загальний бал: ${sum}</p>`;

document.getElementById("res").innerHTML = html;
}
</script>
</body>
</html>
