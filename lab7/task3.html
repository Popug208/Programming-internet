<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Завдання 3</title>
</head>
<body>
  <h2>Завдання 3</h2>
  <button type="button" onclick="runTask3()">Виконати</button>
  <p id="out3"></p>

  <script>
    class Car {
      constructor(brand, model, year) {
        this.brand = brand;
        this.model = model;
        this.year = year;
      }
      info() {
        return `Авто: ${this.brand} ${this.model}, ${this.year} року.`;
      }
    }

    function runTask3() {
      const car1 = new Car("Toyota", "Camry", 2020);
      document.getElementById("out3").textContent = car1.info();
    }
  </script>
</body>
</html>
