<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Завдання 4</title>
</head>
<body>
  <h2>Завдання 4</h2>
  <button type="button" onclick="runTask4()">Виконати</button>
  <p id="out4"></p>

  <script>
    class Car {
      constructor(brand, model, year) {
        this.brand = brand;
        this.model = model;
        this.year = year;
      }
      info() {
        return `Авто: ${this.brand} ${this.model}, ${this.year} року.`;
      }
    }

    class ElectricCar extends Car {
      constructor(brand, model, year, battery) {
        super(brand, model, year);
        this.battery = battery;
      }
      charge() {
        return `${this.brand} ${this.model} заряджається... Батарея: ${this.battery} kWh`;
      }
    }

    function runTask4() {
      const tesla = new ElectricCar("Tesla", "Model 3", 2022, 75);
      document.getElementById("out4").innerHTML = tesla.info() + "<br>" + tesla.charge();
    }
  </script>
</body>
</html>
