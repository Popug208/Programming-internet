<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Завдання 1</title>
  <style>
    #box {
      width: 60px;
      height: 60px;
      background-color: #2b6cb0;
      position: relative;
      left: 0;
    }
  </style>
</head>
<body>
  <h2>Завдання 1</h2>
  <button type="button" onclick="toggleAnim()">Старт / Пауза</button><br><br>
  <div id="box"></div>

  <script>
    let box = document.getElementById("box");
    let pos = 0;
    let dir = 1;
    let running = false;
    let timer = null;

    function step() {
      pos += dir * 2;
      if (pos >= 300) {
        dir = -1;
      } else if (pos <= 0) {
        dir = 1;
      }
      let size = 60 + Math.round(pos / 10);
      box.style.left = pos + "px";
      box.style.width = size + "px";
      box.style.height = size + "px";
    }

    function toggleAnim() {
      if (running) {
        clearInterval(timer);
        running = false;
      } else {
        timer = setInterval(step, 20);
        running = true;
      }
    }
  </script>
</body>
</html>
