<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Завдання 2</title>
  <style>
    #scene {
      position: relative;
      width: 700px;
      height: 320px;
      border: 1px solid #333;
      overflow: hidden;
      cursor: pointer;
      background-color: #f4f7fb;
      font-family: Arial, sans-serif;
    }
    #emblem {
      position: absolute;
      left: 40px;
      top: 90px;
      width: 110px;
      height: 110px;
      border-radius: 16px;
      background-color: #1e40af;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 24px;
      user-select: none;
    }
    #titleText {
      position: absolute;
      left: 180px;
      top: 125px;
      font-size: 22px;
      font-weight: bold;
      color: #0f172a;
      white-space: nowrap;
      user-select: none;
    }
    .spawned {
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background-color: #0284c7;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <h2>Завдання 2</h2>
  <div id="scene" onclick="toggleLogoAnimation()">
    <div id="emblem">ІПЗ</div>
    <div id="titleText"></div>
  </div>

  <script>
    const scene = document.getElementById("scene");
    const emblem = document.getElementById("emblem");
    const titleText = document.getElementById("titleText");

    const fullText = "Інженерія програмного забезпечення";
    let isRunning = false;
    let mainTimer = null;

    let posX = 40;
    let dirX = 1;
    let scale = 1;
    let scaleDir = 0.01;
    let hue = 220;

    let charIndex = 0;
    let textPhase = "typing";
    let opacityVal = 1;
    let tickCount = 0;

    function spawnDot() {
      const dot = document.createElement("div");
      dot.className = "spawned";
      dot.style.left = (posX + 45) + "px";
      dot.style.top = "140px";
      scene.appendChild(dot);

      let dx = (Math.random() * 4 - 2);
      let dy = (Math.random() * 4 - 2);
      let life = 25;

      const dotInterval = setInterval(() => {
        if (!isRunning) return;
        let curLeft = parseFloat(dot.style.left);
        let curTop = parseFloat(dot.style.top);
        dot.style.left = (curLeft + dx) + "px";
        dot.style.top = (curTop + dy) + "px";
        life--;
        if (life <= 0) {
          clearInterval(dotInterval);
          dot.remove();
        }
      }, 25);
    }

    function updateFrame() {
      tickCount++;

      posX += dirX * 2.5;
      if (posX >= 120) {
        dirX = -1;
      } else if (posX <= 30) {
        dirX = 1;
      }

      scale += scaleDir;
      if (scale >= 1.25) {
        scaleDir = -0.01;
      } else if (scale <= 0.85) {
        scaleDir = 0.01;
      }

      hue = (hue + 2) % 360;
      emblem.style.left = posX + "px";
      emblem.style.transform = `scale(${scale.toFixed(2)})`;
      emblem.style.backgroundColor = `hsl(${hue}, 70%, 45%)`;
      emblem.style.borderRadius = scale > 1.05 ? "28px" : "12px";

      if (textPhase === "typing" && tickCount % 4 === 0) {
        if (charIndex < fullText.length) {
          opacityVal = 1;
          titleText.style.opacity = "1";
          charIndex++;
          titleText.textContent = fullText.slice(0, charIndex);
        } else {
          textPhase = "fading";
        }
      } else if (textPhase === "fading") {
        opacityVal -= 0.03;
        if (opacityVal <= 0) {
          opacityVal = 0;
          titleText.style.opacity = "0";
          titleText.textContent = "";
          charIndex = 0;
          textPhase = "typing";
        } else {
          titleText.style.opacity = opacityVal.toFixed(2);
        }
      }

      if (tickCount % 18 === 0) {
        spawnDot();
      }
    }

    function toggleLogoAnimation() {
      if (isRunning) {
        clearInterval(mainTimer);
        isRunning = false;
      } else {
        mainTimer = setInterval(updateFrame, 25);
        isRunning = true;
      }
    }
  </script>
</body>
</html>
