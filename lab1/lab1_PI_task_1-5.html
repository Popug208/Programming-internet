<html>
<head>
<meta charset="UTF-8">
<script language="JavaScript">
function calculation() {
let x = 16;
let result = Math.pow(x, -0.5);
alert(result);
}

function fun(a) {
main_form.t_res.value = a;
}

function fun4() {
let x, y, F;
x = parseFloat(main_form4.t_x.value);
y = parseFloat(main_form4.t_y.value);
if (x * y != -100) F = (2 * x) / y; else
if (x * y != 20) F = Math.pow(x, 3) - 2 * x * y; else
F = Math.pow(x, 2) + 4;
main_form4.t_f.value = "" + F;
}

function fun5() {
let x, y, sum = 0.0, cur = 0.0;
x = parseFloat(main_form5.t_x5.value);
y = parseFloat(main_form5.t_y5.value);
for (let i = 2; i <= 7; i++) {
let factorial1 = 1;
for (let j = 1; j <= i; j++)
factorial1 *= j;
let factorial2 = 1;
for (let j = 1; j <= i + 2; j++)
factorial2 *= j;
cur = Math.pow(-1, i) * (factorial1 - 2 * x * y) / factorial2;
sum += cur;
}
main_form5.t_c.value = "" + sum;
}
</script>
</head>
